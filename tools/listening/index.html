<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Binaural Listening Test</title>
<link rel="icon" href="data:,">
<meta name="description" content="A self-administered headphone test of the Binaural sound mode: localization and musical coherence. Served locally by tools/listening/serve.py.">
<style>
:root {
  --bg: #f6f6f4;
  --panel: #ffffff;
  --text: #1d1f21;
  --muted: #5f6368;
  --line: #d6d6d2;
  --accent: #2557c7;
  --accent-text: #ffffff;
  --good: #1f7a3d;
  --warn: #9a5b00;
  --bad: #b3261e;
  --dial: #eef1f7;
  --truth: #1f7a3d;
  --answer: #2557c7;
  --start: #9a5b00;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17181a;
    --panel: #212326;
    --text: #e8e8e6;
    --muted: #a1a5ab;
    --line: #3a3d42;
    --accent: #7aa2ff;
    --accent-text: #0d1220;
    --good: #6cc489;
    --warn: #e0a64a;
    --bad: #f08a80;
    --dial: #2a2f3a;
    --truth: #6cc489;
    --answer: #7aa2ff;
    --start: #e0a64a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #17181a;
  --panel: #212326;
  --text: #e8e8e6;
  --muted: #a1a5ab;
  --line: #3a3d42;
  --accent: #7aa2ff;
  --accent-text: #0d1220;
  --good: #6cc489;
  --warn: #e0a64a;
  --bad: #f08a80;
  --dial: #2a2f3a;
  --truth: #6cc489;
  --answer: #7aa2ff;
  --start: #e0a64a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
header {
  padding: 12px 16px;
  border-bottom: 1px solid var(--line);
  display: flex;
  gap: 12px;
  align-items: baseline;
  flex-wrap: wrap;
}
header h1 { font-size: 18px; margin: 0; }
header .where { color: var(--muted); font-size: 14px; }
main { max-width: 980px; margin: 0 auto; padding: 16px; }
.panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 16px;
  margin-bottom: 16px;
}
h2 { font-size: 20px; margin: 0 0 8px; }
h3 { font-size: 16px; margin: 16px 0 8px; }
p { margin: 8px 0; }
.muted { color: var(--muted); }
.note { color: var(--warn); }
.error { color: var(--bad); }
.ok { color: var(--good); }
button {
  font: inherit;
  padding: 8px 16px;
  border-radius: 6px;
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--text);
  cursor: pointer;
}
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
button:disabled { opacity: 0.45; cursor: default; }
button.playing { outline: 3px solid var(--accent); outline-offset: 1px; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
label.field { display: flex; flex-direction: column; gap: 4px; font-size: 14px; color: var(--muted); }
input[type="text"] { font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--text); min-width: 240px; }
table { border-collapse: collapse; width: 100%; }
td, th { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.progress { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin: 8px 0 12px; }
.progress > div { height: 100%; background: var(--accent); }
.answer { display: flex; gap: 24px; flex-wrap: wrap; align-items: stretch; justify-content: center; }
.dial { width: min(360px, 100%); aspect-ratio: 1; touch-action: none; user-select: none; }
.dial svg { width: 100%; height: 100%; display: block; }
.dial .face { fill: var(--dial); stroke: var(--line); }
.dial .tick { stroke: var(--muted); }
.dial .label { fill: var(--muted); font-size: 13px; text-anchor: middle; dominant-baseline: middle; }
.dial .head { fill: var(--panel); stroke: var(--muted); }
.dial .answer-mark { fill: var(--answer); }
.dial .answer-line { stroke: var(--answer); stroke-width: 2; }
.dial .start-mark { fill: none; stroke: var(--start); stroke-width: 3; }
.dial .truth-mark { fill: none; stroke: var(--truth); stroke-width: 3; stroke-dasharray: 4 3; }
.elevation { display: flex; gap: 8px; align-items: center; }
.elevation input[type="range"] { writing-mode: vertical-lr; direction: rtl; height: 300px; width: 32px; }
.scale-labels { display: flex; flex-direction: column; justify-content: space-between; height: 300px; font-size: 13px; color: var(--muted); }
.value { font-variant-numeric: tabular-nums; }
.markers { display: flex; gap: 8px; margin-top: 8px; }
.markers button.selected { border-color: var(--accent); background: var(--dial); }
.mushra { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px; }
.mushra .column { display: flex; flex-direction: column; align-items: center; gap: 8px; min-width: 64px; }
.mushra input[type="range"] { writing-mode: vertical-lr; direction: rtl; height: 260px; width: 32px; }
input[type="range"] { accent-color: var(--accent); }
.mushra .value { line-height: 24px; height: 24px; }
.mushra .grades { display: flex; flex-direction: column; justify-content: space-between; height: 260px; font-size: 12px; color: var(--muted); text-align: right; min-width: 96px; }
.mushra .unrated { color: var(--warn); font-size: 12px; }
kbd { font: 13px ui-monospace, monospace; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
</style>
</head>
<body>
<header>
  <h1>Binaural listening test</h1>
  <span class="where">Local only: the stimuli are the game's and stay on this machine.</span>
</header>
<main id="app"><p class="muted">Loading…</p></main>
<script type="module" src="listening.js"></script>
</body>
</html>
