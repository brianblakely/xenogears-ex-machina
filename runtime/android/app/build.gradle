plugins {
    id 'com.android.application'
}

def sdlSource = System.getenv('XEM_SDL3_SRC')
if (sdlSource == null) {
    throw new GradleException('XEM_SDL3_SRC is unset: build inside nix develop path:./nix/runtime#android')
}
def repoRoot = file("$rootDir/../..")
// Outputs stay under the repository's ignored build/ directory.
layout.buildDirectory = new File(repoRoot, 'build/android/gradle/app')
def sdlJava = new File(repoRoot, 'build/android/gradle/app/generated/sdl-java')
// runtime/scripts/android-build.sh puts libSDL3.so and libmain.so here per ABI.
def nativeLibs = new File(repoRoot, 'build/android/jniLibs')

// SDLActivity and its helpers, copied from the SDL release the desktop uses.
def copySdlJava = tasks.register('copySdlJava', Sync) {
    from("$sdlSource/android-project/app/src/main/java") {
        include 'org/libsdl/app/*.java'
    }
    into sdlJava
    // The Nix store copy is read-only.
    dirPermissions { unix('rwxr-xr-x') }
    filePermissions { unix('rw-r--r--') }
}

android {
    namespace = 'dev.xem.app'
    compileSdk = 34
    buildToolsVersion = '34.0.0'
    ndkVersion = '29.0.14206865'

    defaultConfig {
        applicationId = 'dev.xem.app'
        minSdk = 29
        targetSdk = 34
        versionCode = 1
        versionName = '0.1.0'
        ndk {
            abiFilters 'x86_64', 'arm64-v8a'
        }
    }

    sourceSets {
        main {
            java.srcDirs += sdlJava
            jniLibs.srcDirs = [nativeLibs]
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    lint {
        abortOnError = false
        checkReleaseBuilds = false
    }
}

base {
    archivesName = 'xem'
}

tasks.named('preBuild') {
    dependsOn copySdlJava
}
