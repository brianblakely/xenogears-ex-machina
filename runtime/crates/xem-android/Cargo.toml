[package]
name = "xem-android"
description = "The Android host: libmain.so under SDL3's SDLActivity (runtime/android builds the APK)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# SDLActivity loads libmain.so and calls its SDL_main.
name = "main"
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_os = "android")'.dependencies]
sdl3-sys.workspace = true
jni-sys.workspace = true
wgpu.workspace = true
xem-disc = { path = "../xem-disc" }
xem-host = { path = "../xem-host" }
xem-render = { path = "../xem-render" }
xem-settings = { path = "../xem-settings" }
