# Overlay image from Disc 1 slot 2596 / Disc 2 slot 2591 (unpacked; the discs are
# byte-identical). Load address from its internal calls and pointers; the
# rodata/text/data boundaries are initial and are refined during recovery.
name: ovl2596
sha1: fddc1755f033567a1ef3a707ee170fb0411d7d8c
options:
  basename: ovl2596
  base_path: ../../..
  target_path: .local/extract/overlays/ovl2596.bin
  platform: psx
  compiler: PSYQ
  asm_path: .local/decomp/ovl2596/asm
  asset_path: .local/decomp/ovl2596/assets
  src_path: decomp/src/ovl2596
  build_path: .local/decomp/build/ovl2596
  ld_script_path: .local/decomp/ovl2596/ovl2596.ld
  cache_path: .local/decomp/ovl2596/.splat_cache
  symbol_addrs_path:
    - decomp/targets/overlays/ovl2596.symbols.txt
    - decomp/targets/resident/symbol_addrs.txt
  undefined_funcs_auto_path: .local/decomp/ovl2596/undefined_funcs_auto.txt
  undefined_syms_auto_path: .local/decomp/ovl2596/undefined_syms_auto.txt
  find_file_boundaries: False
  gp_value: 0x80059170
  ld_gp_expression: "0x80059170"
  o_as_suffix: True
  generate_asm_macros_files: False
  ld_bss_is_noload: False
  ld_align_segment_vram_end: False
  ld_align_section_vram_end: False
  use_legacy_include_asm: False
  section_order: [".rodata", ".text", ".data", ".bss"]
  subalign: 4
  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  include_asm_macro_style: maspsx_hack
segments:
  - name: ovl2596
    type: code
    start: 0x0
    vram: 0x801de000
    subsegments:
      - [0x0, .rodata, battle_results_screens]
      - [0x48, c, battle_results_screens]
      # The .data opens with battle_results_fanfare_started (u8 0): the padding after it holds a
      # byte (0x04) that nothing reads, as the original assembler left in
      # string padding elsewhere; battle_results_screens.c includes it from the original
      # (INCLUDE_ORIGINAL).
      - [0x64c0, .data, battle_results_screens]
      # From 801e44cc the file holds the module's uninitialized variables
      # (its .bss, loaded) as zeros. All are commons, which the original
      # linker allocated each in a slot of whole words (decomp/Makefile): the
      # u8 at 801e44e4 follows the u8 at 801e44e0 four bytes on. The image
      # ends two bytes after the last, the u8[3][2] at 801e44f8, as a
      # word-rounded section or file would.
      - [0x64cc, .bss, battle_results_screens]
  - [0x6500]
