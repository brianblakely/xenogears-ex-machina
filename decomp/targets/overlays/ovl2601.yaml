# Overlay image from Disc 1 slot 2601 / Disc 2 slot 2596 (unpacked; the discs are
# byte-identical). Load address from its internal calls and pointers; the
# rodata/text/data boundaries are initial and are refined during recovery.
name: ovl2601
sha1: 73b05ae7c8ea99a60e24db8ee96dbc5bc441bb4f
options:
  basename: ovl2601
  base_path: ../../..
  target_path: .local/extract/overlays/ovl2601.bin
  platform: psx
  compiler: PSYQ
  asm_path: .local/decomp/ovl2601/asm
  asset_path: .local/decomp/ovl2601/assets
  src_path: decomp/src/ovl2601
  build_path: .local/decomp/build/ovl2601
  ld_script_path: .local/decomp/ovl2601/ovl2601.ld
  cache_path: .local/decomp/ovl2601/.splat_cache
  symbol_addrs_path:
    - decomp/targets/overlays/ovl2601.symbols.txt
    - decomp/targets/resident/symbol_addrs.txt
  undefined_funcs_auto_path: .local/decomp/ovl2601/undefined_funcs_auto.txt
  undefined_syms_auto_path: .local/decomp/ovl2601/undefined_syms_auto.txt
  find_file_boundaries: False
  gp_value: 0x80059170
  ld_gp_expression: "0x80059170"
  o_as_suffix: True
  generate_asm_macros_files: False
  ld_bss_is_noload: True
  ld_align_segment_vram_end: False
  ld_align_section_vram_end: False
  use_legacy_include_asm: False
  section_order: [".rodata", ".text", ".data", ".bss"]
  subalign: 4
  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  include_asm_macro_style: maspsx_hack
segments:
  - name: ovl2601
    type: code
    start: 0x0
    vram: 0x801c5000
    subsegments:
      - [0x0, rodata, ovl2601_prefix]
      - [0x10, .rodata, shop]
      - [0x40, c, ovl2601]
      # The shop's own unit; see the head of shop.c.
      - [0x7E1C, c, shop]
      - [0xcf50, data, ovl2601_data]
  - [0xd264]
