# Overlay image from Disc 1 slot 2600 / Disc 2 slot 2595 (unpacked; the discs are
# byte-identical). Load address from its internal calls and pointers; the
# rodata/text/data boundaries are initial and are refined during recovery.
name: ovl2600
sha1: 6bd59c26a9fcf517897f63a2cafa4e1696e4294f
options:
  basename: ovl2600
  base_path: ../../..
  target_path: .local/extract/overlays/ovl2600.bin
  platform: psx
  compiler: PSYQ
  asm_path: .local/decomp/ovl2600/asm
  asset_path: .local/decomp/ovl2600/assets
  src_path: decomp/src/ovl2600
  build_path: .local/decomp/build/ovl2600
  ld_script_path: .local/decomp/ovl2600/ovl2600.ld
  cache_path: .local/decomp/ovl2600/.splat_cache
  symbol_addrs_path:
