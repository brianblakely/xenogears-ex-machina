    - decomp/targets/resident/symbol_addrs.txt
  undefined_funcs_auto_path: .local/decomp/ovl2600/undefined_funcs_auto.txt
  undefined_syms_auto_path: .local/decomp/ovl2600/undefined_syms_auto.txt
  find_file_boundaries: False
  gp_value: 0x80059170
