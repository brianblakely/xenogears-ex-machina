# Overlay image from Disc 1 slot 2602 / Disc 2 slot 2597 (unpacked; the discs are
# byte-identical). Load address from its internal calls and pointers; the
# rodata/text/data boundaries are initial and are refined during recovery.
name: ovl2602
sha1: a90baee4be1bba837533e226beb8b867af3b798d
options:
  basename: ovl2602
  base_path: ../../..
  target_path: .local/extract/overlays/ovl2602.bin
  platform: psx
  compiler: PSYQ
  asm_path: .local/decomp/ovl2602/asm
  asset_path: .local/decomp/ovl2602/assets
  src_path: decomp/src/ovl2602
  build_path: .local/decomp/build/ovl2602
  ld_script_path: .local/decomp/ovl2602/ovl2602.ld
  cache_path: .local/decomp/ovl2602/.splat_cache
  symbol_addrs_path:
    - decomp/targets/overlays/ovl2602.symbols.txt
    - decomp/targets/resident/symbol_addrs.txt
  undefined_funcs_auto_path: .local/decomp/ovl2602/undefined_funcs_auto.txt
  undefined_syms_auto_path: .local/decomp/ovl2602/undefined_syms_auto.txt
  find_file_boundaries: False
  gp_value: 0x80059170
  ld_gp_expression: "0x80059170"
  o_as_suffix: True
  generate_asm_macros_files: False
  ld_bss_is_noload: True
  ld_align_segment_vram_end: False
  ld_align_section_vram_end: False
  use_legacy_include_asm: False
  section_order: [".rodata", ".text", ".data", ".bss"]
  subalign: 4
  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  include_asm_macro_style: maspsx_hack
segments:
  - name: ovl2602
    type: code
    start: 0x0
    vram: 0x801c5000
    subsegments:
      - [0x0, .rodata, ovl2602]
      - [0x38, .rodata, gear_shop]
      - [0x11c, c, ovl2602]
      - [0x91D0, c, gear_shop]
      - [0x1197c, .data, ovl2602]
      # The gear screen unit's data, then the overlay's zero-filled
      # uninitialized variables (see the head of gear_shop.c).
      - [0x11d08, .data, gear_shop]
  - [0x140a0]
