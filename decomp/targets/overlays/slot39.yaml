# Overlay image from Disc 1 slot 2597 / Disc 2 slot 2592 (unpacked; the discs are
# byte-identical). Load address from its internal calls and pointers; the
# rodata/text/data boundaries are initial and are refined during recovery.
name: slot39
sha1: fd911d26b921d6eb0c73c3bbc83ea82dc459122f
options:
  basename: slot39
  base_path: ../../..
  target_path: .local/extract/overlays/slot39.bin
  platform: psx
  compiler: PSYQ
  asm_path: .local/decomp/slot39/asm
  asset_path: .local/decomp/slot39/assets
  src_path: decomp/src/slot39
  build_path: .local/decomp/build/slot39
  ld_script_path: .local/decomp/slot39/slot39.ld
  cache_path: .local/decomp/slot39/.splat_cache
  symbol_addrs_path:
    - decomp/targets/overlays/slot39.symbols.txt
    - decomp/targets/resident/symbol_addrs.txt
  undefined_funcs_auto_path: .local/decomp/slot39/undefined_funcs_auto.txt
  undefined_syms_auto_path: .local/decomp/slot39/undefined_syms_auto.txt
  find_file_boundaries: False
  gp_value: 0x80059170
  ld_gp_expression: "0x80059170"
  o_as_suffix: True
  generate_asm_macros_files: False
  ld_bss_is_noload: True
  ld_align_segment_vram_end: False
  ld_align_section_vram_end: False
  use_legacy_include_asm: False
  section_order: [".rodata", ".text", ".data", ".bss"]
  subalign: 4
  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  include_asm_macro_style: maspsx_hack
segments:
  - name: slot39
    type: code
    start: 0x0
    vram: 0x801c5000
    subsegments:
      # Translation units: jump tables keep their unit's rodata phase mod 8
      # (docs/matching.md); 801DBE54's starts at 4 mod 8 after the previous
      # unit's strings, and 801E8070's returns to 0 mod 8 right after
      # 801E433C's odd-length table.
      - [0x0, .rodata, slot39]
      - [0xFC, .rodata, slot39_801DBE54]
      - [0x278, .rodata, slot39_801E8070]
      - [0x31c, c, slot39]
      - [0x16E54, c, slot39_801DBE54]
      - [0x23070, c, slot39_801E8070]
      # All initialized data is slot39's: the other units' tables are interleaved
      # with its own and come before every unit's uninitialized variables.
      # Then each unit's uninitialized variables (zero in the image), defined
      # zero-initialized where their C layout is the original one.
      - [0x246A4, .data, slot39]
      # slot39's from D_801EA714: two bytes four apart, the original's 4-byte
      # slots, are no C layout.
      - [0x25714, data, slot39_data]
      - [0x25730, .data, slot39_801DBE54]
      - [0x258F4, .data, slot39_801E8070]
      # The common variables, allocated after every unit's own.
      - [0x258FC, .data, slot39_common]
  - [0x25908]
