# Overlay image from Disc 1 slot 2143 / Disc 2 slot 2138 (unpacked; the discs are
# byte-identical). Load address from its internal calls and pointers; the
# rodata/text/data boundaries are initial and are refined during recovery.
name: ovl2143
sha1: 26c0034b549a901341844920dd2249223ab8806a
options:
  basename: ovl2143
  base_path: ../../..
  target_path: .local/extract/overlays/ovl2143.bin
  platform: psx
  compiler: PSYQ
  asm_path: .local/decomp/ovl2143/asm
  asset_path: .local/decomp/ovl2143/assets
  src_path: decomp/src/ovl2143
  build_path: .local/decomp/build/ovl2143
  ld_script_path: .local/decomp/ovl2143/ovl2143.ld
  cache_path: .local/decomp/ovl2143/.splat_cache
  symbol_addrs_path:
    - decomp/targets/overlays/ovl2143.symbols.txt
    - decomp/targets/resident/symbol_addrs.txt
  undefined_funcs_auto_path: .local/decomp/ovl2143/undefined_funcs_auto.txt
  undefined_syms_auto_path: .local/decomp/ovl2143/undefined_syms_auto.txt
  find_file_boundaries: False
  gp_value: 0x80059170
  ld_gp_expression: "0x80059170"
  o_as_suffix: True
  generate_asm_macros_files: False
  ld_bss_is_noload: False
  ld_align_segment_vram_end: False
  ld_align_section_vram_end: False
  use_legacy_include_asm: False
  section_order: [".rodata", ".text", ".data", ".bss"]
  subalign: 4
  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  include_asm_macro_style: maspsx_hack
segments:
  - name: ovl2143
    type: code
    start: 0x0
    vram: 0x801dc000
    subsegments:
      - [0x0, .rodata, ovl2143]
      - [0x22c, c, ovl2143]
      - [0xc590, .data, ovl2143]
      # The file ends with the module state (its .bss, loaded) as zeros,
      # each object in a slot of whole words (decomp/Makefile): D_801E869C
      # starts its own slot after the s16 D_801E8698, and the file ends with
      # the rest of D_801E86B0's.
      - [0xc5cc, .bss, ovl2143]
  - [0xc6b4]
