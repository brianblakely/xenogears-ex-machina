# Overlay image from Disc 1 slot 37 / Disc 2 slot 32 (packed; the discs are
# byte-identical). Load address from its internal calls and pointers; the
# rodata/text/data boundaries are initial and are refined during recovery.
name: worldmap
sha1: 5fee1deab3558c23bbe9c3a2eda3a2021a570911
options:
  basename: worldmap
  base_path: ../../..
  target_path: .local/extract/overlays/worldmap.bin
  platform: psx
  compiler: PSYQ
  asm_path: .local/decomp/worldmap/asm
  asset_path: .local/decomp/worldmap/assets
  src_path: decomp/src/worldmap
  build_path: .local/decomp/build/worldmap
  ld_script_path: .local/decomp/worldmap/worldmap.ld
  cache_path: .local/decomp/worldmap/.splat_cache
  symbol_addrs_path:
    - decomp/targets/overlays/worldmap.symbols.txt
    - decomp/targets/resident/symbol_addrs.txt
  undefined_funcs_auto_path: .local/decomp/worldmap/undefined_funcs_auto.txt
  undefined_syms_auto_path: .local/decomp/worldmap/undefined_syms_auto.txt
  find_file_boundaries: False
  gp_value: 0x80059170
  ld_gp_expression: "0x80059170"
  o_as_suffix: True
  generate_asm_macros_files: False
  ld_bss_is_noload: True
  ld_align_segment_vram_end: False
  ld_align_section_vram_end: False
  use_legacy_include_asm: False
  section_order: [".rodata", ".text", ".data", ".bss"]
  subalign: 4
  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  include_asm_macro_style: maspsx_hack
segments:
  - name: worldmap
    type: code
    start: 0x0
    vram: 0x8006faf0
    subsegments:
      - [0x0, .rodata, worldmap]
      - [0x120c, c, worldmap]
      - [0x2a39c, data, worldmap_data]
      # The decoded length is not word-aligned; its final bytes are zero.
      - [0x2c0c4, databin, worldmap_tail]
  - [0x2c0c6]
