# Overlay image from Disc 1 slot 37 / Disc 2 slot 32 (packed; the discs are
# byte-identical). Load address from its internal calls and pointers; the
# rodata/text/data boundaries are initial and are refined during recovery.
name: worldmap
sha1: 5fee1deab3558c23bbe9c3a2eda3a2021a570911
options:
  basename: worldmap
  base_path: ../../..
  target_path: .local/extract/overlays/worldmap.bin
  platform: psx
  compiler: PSYQ
  asm_path: .local/decomp/worldmap/asm
  asset_path: .local/decomp/worldmap/assets
  src_path: decomp/src/worldmap
  build_path: .local/decomp/build/worldmap
  ld_script_path: .local/decomp/worldmap/worldmap.ld
  cache_path: .local/decomp/worldmap/.splat_cache
  symbol_addrs_path:
    - decomp/targets/overlays/worldmap.symbols.txt
    - decomp/targets/resident/symbol_addrs.txt
  undefined_funcs_auto_path: .local/decomp/worldmap/undefined_funcs_auto.txt
  undefined_syms_auto_path: .local/decomp/worldmap/undefined_syms_auto.txt
  find_file_boundaries: False
  gp_value: 0x80059170
  ld_gp_expression: "0x80059170"
  o_as_suffix: True
  generate_asm_macros_files: False
  ld_bss_is_noload: True
  ld_align_segment_vram_end: False
  ld_align_section_vram_end: False
  use_legacy_include_asm: False
  section_order: [".rodata", ".text", ".data", ".bss"]
  subalign: 4
  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  include_asm_macro_style: maspsx_hack
segments:
  - name: worldmap
    type: code
    start: 0x0
    vram: 0x8006faf0
    bss_size: 0x1C5C
    # Translation units. ASPSX aligns jump tables (`.align 3`) relative to their
    # object's section, and the linker places sections 4-aligned, so a change in
    # jump-table phase (address mod 8) without padding starts a new unit's
    # rodata. Each unit's text starts after the previous unit's last rodata
    # owner and no later than its own first one; the split uses the latter.
    subsegments:
      - [0x0, .rodata, worldmap]
      - [0x4, .rodata, worldmap_open_map]
      - [0x50, .rodata, worldmap_scenes_9_10]
      - [0xd4, .rodata, worldmap_scene14]
      - [0x160, .rodata, worldmap_scene12]
      - [0x29c, .rodata, worldmap_scene15]
      - [0x6f0, .rodata, worldmap_scene13]
      - [0x7f4, .rodata, worldmap_scenes_16_18]
      - [0x9a0, .rodata, worldmap_objects_effects_party]
      - [0xcbc, .rodata, worldmap_vehicles]
      - [0xf08, .rodata, worldmap_flying_vehicle]
      - [0x1064, .rodata, worldmap_steering_camera_terrain]
      - [0x1160, .rodata, worldmap_movement_terrain]
      - [0x120c, c, worldmap]
      - [0x2748, c, worldmap_open_map]
      - [0x8378, c, worldmap_scenes_9_10]
      - [0xaf08, c, worldmap_scene14]
      - [0xc8c8, c, worldmap_scene12]
      - [0xe3a8, c, worldmap_scene15]
      - [0x10880, c, worldmap_scene13]
      - [0x116d0, c, worldmap_scenes_16_18]
      - [0x13f10, c, worldmap_objects_effects_party]
      - [0x1c874, c, worldmap_vehicles]
      - [0x1e6a0, c, worldmap_flying_vehicle]
      - [0x20f94, c, worldmap_steering_camera_terrain]
      - [0x24f6c, c, worldmap_movement_terrain]
      - [0x2a39c, .data, worldmap_open_map]
      - [0x2a900, .data, worldmap_scenes_9_10]
      - [0x2a960, .data, worldmap_scene14]
      - [0x2a9e8, .data, worldmap_scene12]
      - [0x2aab0, .data, worldmap_scene15]
      - [0x2aba8, .data, worldmap_scene13]
      - [0x2abd0, .data, worldmap_scenes_16_18]
      - [0x2b23c, .data, worldmap_objects_effects_party]
      - [0x2b6bc, .data, worldmap_flying_vehicle]
      - [0x2b724, .data, worldmap_steering_camera_terrain]
      - [0x2ba74, .data, worldmap_movement_terrain]
      # The uninitialized variables follow the program, not loaded: the BSS
      # the resident's mode table clears (8009bbb0 + 4 through the word at
      # 8009d80c, bss_size above). No unit has statics; the commons, which
      # the original linker allocated in an order of its own, fill it
      # (worldmap_common.c). Declaring it here keeps their names out of
      # undefined_syms_auto.txt: the link places every one from its
      # definition.
      - { type: .bss, vram: 0x8009BBB4, name: worldmap_common }
  - [0x2c0c4]
  # The packer completes its last group of eight tokens with zero literals
  # and records the padded length (worldmap.mk), so the decoded image ends
  # two zero bytes after the data, inside the BSS, where the terrain origin
  # worldmap_terrain_origin lives.
  - [0x2c0c6]
