# rodata/text/data boundaries are initial and are refined during recovery.
name: ovl2615
sha1: 1e0a331245ad46c3bde1a70ad144771c4bd5c26a
options:
  basename: ovl2615
  base_path: ../../..
  target_path: .local/extract/overlays/ovl2615.bin
  platform: psx
  compiler: PSYQ
  asm_path: .local/decomp/ovl2615/asm
  asset_path: .local/decomp/ovl2615/assets
  src_path: decomp/src/ovl2615
  build_path: .local/decomp/build/ovl2615
  ld_script_path: .local/decomp/ovl2615/ovl2615.ld
