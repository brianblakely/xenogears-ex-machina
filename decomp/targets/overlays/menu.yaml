# Overlay image from Disc 1 slot 35 / Disc 2 slot 30 (packed; the discs are
# byte-identical). Load address from its internal calls and pointers; the
# rodata/text/data boundaries are initial and are refined during recovery.
name: menu
sha1: 9cfebaf201a0dfd352c11007a63ad7a955533b17
options:
  basename: menu
  base_path: ../../..
  target_path: .local/extract/overlays/menu.bin
  platform: psx
  compiler: PSYQ
  asm_path: .local/decomp/menu/asm
  asset_path: .local/decomp/menu/assets
  src_path: decomp/src/menu
  build_path: .local/decomp/build/menu
  ld_script_path: .local/decomp/menu/menu.ld
  cache_path: .local/decomp/menu/.splat_cache
  symbol_addrs_path:
    - decomp/targets/overlays/menu.symbols.txt
    - decomp/targets/resident/symbol_addrs.txt
  undefined_funcs_auto_path: .local/decomp/menu/undefined_funcs_auto.txt
  undefined_syms_auto_path: .local/decomp/menu/undefined_syms_auto.txt
  find_file_boundaries: False
  gp_value: 0x80059170
  ld_gp_expression: "0x80059170"
  o_as_suffix: True
  generate_asm_macros_files: False
  ld_bss_is_noload: False
  ld_align_segment_vram_end: False
  ld_align_section_vram_end: False
  use_legacy_include_asm: False
  section_order: [".rodata", ".text", ".data", ".bss"]
  subalign: 4
  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  include_asm_macro_style: maspsx_hack
segments:
  - name: menu
    type: code
    start: 0x0
    vram: 0x8006faf0
    subsegments:
      # Translation units. GCC puts `.align 3` before every jump table; the
      # assembler honours it relative to the unit's .rodata section, and the
      # original linker (like SUBALIGN(4) here) placed sections at 4-byte
      # boundaries. Tables of one unit therefore share their address mod 8,
      # and a zero word pads an odd-length table followed by another table
      # (8006FB98). A change of that phase between two tables marks a unit
      # boundary; the text boundary is placed at the nearest evidence:
      # hand-written code (80072D18-800732CC), the start of a subsystem, or
      # the data word at 80088BFC, which no compiled unit puts in .text.
      - [0x0, .rodata, menu]
      - [0x4, .rodata, menu2]     # tables 8006FAF4-8006FB9C at 4 mod 8
      - [0x108, .rodata, menu3]   # tables 8006FBF8-8006FDE8 at 0 mod 8
      - [0x32C, .rodata, menu4]   # tables 8006FE1C-8007019C at 4 mod 8
      - [0x6C0, .rodata, menu5]   # tables 800701C0, 80070260 at 0 mod 8
      - [0x794, .rodata, menu6]   # strings only
      - [0xBF8, .rodata, menu7]   # tables 800706E8-80070748 at 0 mod 8
      # The overlay number's unit has no code: 800707A8-8007099C reads
      # menu2's uninitialized variables, so menu2's text starts there. The
      # variables (see the .bss below) also place the menu3/menu4 boundary
      # at 8007E528 (8007E3CC reads menu3's, 8007E528 menu4's) and bound
      # menu4/menu5's to 80081E00, 80081E6C or 80081ECC: 80081D2C is the
      # last function reading menu4's own, 80081ECC the first reading
      # menu5's, and the two between touch only commons. The latest is kept.
      - [0xcb8, c, menu2]
      - [0x37DC, c, menu3]
      - [0xEA38, c, menu4]
      - [0x123DC, c, menu5]
      # menu6 opens with a data word in .text: the mode-task table D_80088BFC.
      - [0x1910C, c, menu6]
      - [0x196D0, c, menu7]
      # Initialized data of each unit in link order; menu has none.
      - [0x21448, .data, menu2]
      - [0x21604, .data, menu3]
      - [0x21740, .data, menu4]
      # menu5's data opens with the stage colours (D_8009178C), which only
      # its func_80082A70 reads.
      - [0x21C9C, .data, menu5]
      # menu6's gear list: its strings open menu6's rodata (80070284).
      - [0x21E74, .data, menu6]
      # menu7's .data ends with the embedded sprite model D_80091FB0 (asset,
      # menu.classification.txt) and D_800925A4, whose padding holds three
      # stray assembler bytes ("ind").
      - [0x2211C, .data, menu7]
      # The file then holds the uninitialized variables of up to eight
      # bytes (loaded .bss), zero, each in a slot of whole words
      # (decomp/Makefile): every unit's own, in unit order, then the commons
      # (menu_common.c). The larger ones follow past the program's end in
      # the same order: each unit's own from D_80092954 to 80096FA8, then
      # the large commons up to the mode table's BSS end, 8009B558. The
      # GCC 2.6.3 images keep one .bss in declaration order (slot39, mdec),
      # so the split is likely the original assembler's 8-byte small-data
      # threshold applied to the .lcomm/.comm GCC emits after the code,
      # with the linker's small commons (docs/matching.md). Until it is
      # modelled the larger variables stay extern (undefined_syms_auto.txt):
      # defined in their units, they would be allocated among the small
      # ones. Every variable a unit reads lies in its own range
      # (tools/data_users.py menu.mk --end 80096fa8: no FOREIGN reference or
      # INVERSION; the one SHARED address, 80092A30, is menu3's variable and
      # the end bound menu2 forms for its array at 800929F4), which places
      # or bounds the text boundaries above.
      - [0x22AE4, .bss, menu2]
      - [0x22B48, .bss, menu3]
      - [0x22BE4, .bss, menu4]
      - [0x22C78, .bss, menu5]
      - [0x22D00, .bss, menu6]
      - [0x22D10, .bss, menu7]
      - [0x22D5C, .bss, menu_common]
  - [0x22E64]
  # The packer completes its last group of eight tokens with zero literals
  # and records the padded length (menu.mk), so the decoded image ends five
  # zero bytes after the program, inside the window record D_80092954.
  - [0x22e69]
