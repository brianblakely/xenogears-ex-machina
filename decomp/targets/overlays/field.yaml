# Overlay image from Disc 1 slot 36 / Disc 2 slot 31 (packed; the discs are
# byte-identical). Load address from its internal calls and pointers; the
# rodata/text/data boundaries are initial and are refined during recovery.
name: field
sha1: 7bdc0e2be7797ab821fb7d0ce10438a0e91f4c7b
options:
  basename: field
  base_path: ../../..
  target_path: .local/extract/overlays/field.bin
  platform: psx
  compiler: PSYQ
  asm_path: .local/decomp/field/asm
  asset_path: .local/decomp/field/assets
  src_path: decomp/src/field
  build_path: .local/decomp/build/field
  ld_script_path: .local/decomp/field/field.ld
  cache_path: .local/decomp/field/.splat_cache
  symbol_addrs_path:
    - decomp/targets/overlays/field.symbols.txt
    - decomp/targets/resident/symbol_addrs.txt
  undefined_funcs_auto_path: .local/decomp/field/undefined_funcs_auto.txt
  undefined_syms_auto_path: .local/decomp/field/undefined_syms_auto.txt
  find_file_boundaries: False
  gp_value: 0x80059170
  ld_gp_expression: "0x80059170"
  o_as_suffix: True
  generate_asm_macros_files: False
  ld_bss_is_noload: True
  ld_align_segment_vram_end: False
  ld_align_section_vram_end: False
  use_legacy_include_asm: False
  section_order: [".rodata", ".text", ".data", ".bss"]
  subalign: 4
  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  include_asm_macro_style: maspsx_hack
segments:
  - name: field
    type: code
    start: 0x0
    vram: 0x8006faf0
    bss_size: 0x14C88
    subsegments:
      # Units change where the jump tables change phase mod 8 (GCC's .align 3
      # is relative to the unit's rodata, placed at 4-byte boundaries; see
      # docs/matching.md). The text boundaries are documented in each file.
      # The first unit's rodata opens with the overlay's number (4).
      - [0x0, .rodata, field]
      - [0x9C, .rodata, field_motion]
      - [0x198, .rodata, field_event]
      - [0x2BC, .rodata, field_screen]
      - [0x2D8, .rodata, field_effect]
      - [0x2fc, c, field]
      - [0xA95C, c, field_motion]
      - [0x159E0, c, field_event]
      - [0x34C58, c, field_screen]
      - [0x39784, c, field_effect]
      - [0x3df78, .data, field]
      - [0x3e1f0, .data, field_motion]
      - [0x3e4dc, .data, field_event]
      - [0x3f034, .data, field_screen]
      - [0x3f984, .data, field_effect]
      # The uninitialized variables follow the program, not loaded: the BSS
      # the resident's mode table clears (800af5e4 + 4 through the word at
      # 800c426c, bss_size above). Each unit's own come first, in unit order:
      # only field_event (the RECT ring 80091adc keeps) and field_effect
      # (the text sequence) have statics, and no unit forms an address in
      # another's. The commons, which every unit reaches, follow up to the end
      # in the original linker's order (field_common.c). Declaring them here
      # keeps their names out of undefined_syms_auto.txt: the link places
      # every one from its definition.
      - { type: .bss, vram: 0x800AF5E8, name: field_event }
      - { type: .bss, vram: 0x800AF76C, name: field_effect }
      - { type: .bss, vram: 0x800AF858, name: field_common }
  - [0x3faf8]
  # The packer completes its last group of eight tokens with zero literals
  # and records the padded length (field.mk), so the decoded image ends six
  # zero bytes after the data, inside the BSS, where the RECT ring at
  # 800af5e8 lives.
  - [0x3fafe]
