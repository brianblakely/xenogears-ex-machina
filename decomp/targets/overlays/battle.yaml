# Overlay image from Disc 1 slot 38 / Disc 2 slot 33 (packed; the discs are
# byte-identical). Load address from its internal calls and pointers; the
# rodata/text/data boundaries are initial and are refined during recovery.
name: battle
sha1: 124703d415f570f9cd8d7dad89c6a4eddfd7e6f0
options:
  basename: battle
  base_path: ../../..
  target_path: .local/extract/overlays/battle.bin
  platform: psx
  compiler: PSYQ
  asm_path: .local/decomp/battle/asm
  asset_path: .local/decomp/battle/assets
  src_path: decomp/src/battle
  build_path: .local/decomp/build/battle
  ld_script_path: .local/decomp/battle/battle.ld
  cache_path: .local/decomp/battle/.splat_cache
  symbol_addrs_path:
    - decomp/targets/overlays/battle.symbols.txt
    - decomp/targets/resident/symbol_addrs.txt
  undefined_funcs_auto_path: .local/decomp/battle/undefined_funcs_auto.txt
  undefined_syms_auto_path: .local/decomp/battle/undefined_syms_auto.txt
  find_file_boundaries: False
  gp_value: 0x80059170
  ld_gp_expression: "0x80059170"
  o_as_suffix: True
  generate_asm_macros_files: False
  ld_bss_is_noload: True
  ld_align_segment_vram_end: False
  ld_align_section_vram_end: False
  use_legacy_include_asm: False
  section_order: [".rodata", ".text", ".data", ".bss"]
  subalign: 4
  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  include_asm_macro_style: maspsx_hack
segments:
  - name: battle
    type: code
    start: 0x0
    vram: 0x8006faf0
    # The uninitialized variables, not in the file: the resident's mode
    # table (8001808c, mode 2) clears 800c3a70-800d39f4 for this overlay
    # (800c3a6c and 800d39f0 with its pre-increment loop, 80019560).
    bss_size: 0xFF84
    subsegments:
      # The overlay's number (6) ahead of the units' rodata, as in field (4),
      # worldmap (5), menu (7) and movie (8); the first unit's rodata starts
      # at 0x4, where its jump tables sit (4 mod 8, docs/matching.md).
      - [0x0, .rodata, battle_prefix]
      # Units change where the jump tables change phase mod 8 (GCC's .align 3
      # is relative to the unit's rodata, placed at 4-byte boundaries; see
      # docs/matching.md). The tables at 80070314-80070370 (8008B478,
      # 8008BED8, 8008C81C) sit at 4 mod 8 between runs at 0 mod 8; their
      # unit's text starts after 800861D0 and ends before 80094EE4.
      - [0x4, .rodata, battle_turns_and_hud]
      - [0x18, .rodata, battle_ai_runners]
      - [0x8C, .rodata, battle_ai_opcodes]
      - [0x520, .rodata, battle]
      - [0x824, .rodata, battle_command_submenus]
      - [0x880, .rodata, battle_menus_and_resolver]
      - [0x9DC, .rodata, battle_scene]
      - [0xCEC, .rodata, battle_tmd_screen_effects]
      - [0xD60, .rodata, battle_sprite_commands]
      - [0xF0C, .rodata, battle_action_files]
      - [0xF20, .rodata, battle_flow]
      - [0xFEC, .rodata, battle_frame]
      - [0x1018, .rodata, battle_settle]
      - [0x1124, .rodata, battle_sprite_vm]
      - [0x133c, c, battle_turns_and_hud]
      - [0x9808, c, battle_ai_runners]
      - [0xA3E8, c, battle_ai_opcodes]
      - [0x1166C, c, battle]
      - [0x1B988, c, battle_command_submenus]
      - [0x1D1DC, c, battle_menus_and_resolver]
      - [0x2EA4C, c, battle_scene]
      - [0x41AE8, c, battle_tmd_screen_effects]
      - [0x44414, c, battle_sprite_commands]
      # The unit holding 800B7870's table starts at 800B7134 at the latest:
      # its own variable battle_shatter_ot is also 800B7134's and 800B7160's.
      - [0x47644, c, battle_action_files]
      - [0x485A8, c, battle_flow]
      - [0x4D8BC, c, battle_frame]
      - [0x50358, c, battle_settle]
      - [0x516DC, c, battle_sprite_vm]
      # Each unit's .data follows in unit order; the shared tables open it in
      # the main unit (80070E2C). Objects followed by stray bytes
      # (battle_in_automatic_turn, battle_applying_item_results, battle_combo_step_flags, battle_music_lowered, battle_showing_status_drains,
      # battle_effects_disabled, battle_condition_idle_motions, and 800C3488, unreferenced, whose object and
      # padding are inferred by analogy with ovl2596's D_801E44C0) are
      # included from the original in their units (INCLUDE_ORIGINAL).
      - [0x52558, .data, battle_turns_and_hud]
      - [0x5399C, .data, battle_menus_and_resolver]
      - [0x53A18, .data, battle_scene]
      - [0x53A58, .data, battle_tmd_screen_effects]
      - [0x53A74, .data, battle_sprite_commands]
      - [0x53AE8, .data, battle_flow]
      - [0x53C5C, .data, battle_frame]
      - [0x53CE4, .data, battle_settle]
      # The .bss (not loaded): each unit's own variables in unit order, each
      # read only by its own code (tools/data_users.py), then the commons,
      # which the original linker allocated after every unit's own in an
      # order of its own; battle_common.c, linked last, defines them.
      - { start: 0x53F80, type: .bss, vram: 0x800C3A70, name: battle }
      - { start: 0x53F80, type: .bss, vram: 0x800C3AA4, name: battle_menus_and_resolver }
      - { start: 0x53F80, type: .bss, vram: 0x800C3AAC, name: battle_scene }
      - { start: 0x53F80, type: .bss, vram: 0x800C3BD0, name: battle_tmd_screen_effects }
      - { start: 0x53F80, type: .bss, vram: 0x800C3CA4, name: battle_sprite_commands }
      - { start: 0x53F80, type: .bss, vram: 0x800C3CB4, name: battle_action_files }
      - { start: 0x53F80, type: .bss, vram: 0x800C3CB8, name: battle_flow }
      - { start: 0x53F80, type: .bss, vram: 0x800C3CE8, name: battle_frame }
      - { start: 0x53F80, type: .bss, vram: 0x800C3CEC, name: battle_common }
  - [0x53f80]
