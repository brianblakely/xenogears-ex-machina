[package]
name = "xem-web"
description = "The browser host: the game module beside the Rust runtime, canvas rendering, Web Audio, local disc import, storage and the automation API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# The host exists only on wasm32; elsewhere the crate is empty.
[target.'cfg(target_arch = "wasm32")'.dependencies]
xem-core = { path = "../xem-core" }
xem-disc = { path = "../xem-disc" }
xem-render = { path = "../xem-render" }
xem-settings = { path = "../xem-settings" }
xem-ui = { path = "../xem-ui" }
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = [
    "console",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "Navigator",
    "Storage",
    "Window",
] }
serde.workspace = true
serde_json.workspace = true
