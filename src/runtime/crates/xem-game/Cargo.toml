[package]
name = "xem-game"
description = "The game module natively: wasm2c output compiled into the host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
links = "xem_game"

[dependencies]
xem-core = { path = "../xem-core" }
xem-disc = { path = "../xem-disc" }
xem-storage = { path = "../xem-storage" }
serde_json.workspace = true
bincode = { version = "=2.0.1", default-features = false, features = ["std", "serde"] }
sha2 = "=0.11.0"

[build-dependencies]
cc = { workspace = true, features = ["parallel"] }
sha2 = "=0.11.0"
