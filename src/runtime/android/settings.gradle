// The Android APK: SDL3's SDLActivity (Java from the desktop's SDL release,
// $XEM_SDL3_SRC), libSDL3.so and the xem-android libmain.so. Build it with
// src/runtime/scripts/android-build.sh inside `nix develop path:./nix/runtime#android`
// (Nix's Gradle; no wrapper).
pluginManagement {
    repositories {
        google()
        maven { url = uri('https://maven-central.storage-download.googleapis.com/maven2/') }
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        maven { url = uri('https://maven-central.storage-download.googleapis.com/maven2/') }
        mavenCentral()
    }
}

rootProject.name = 'xem'
include ':app'
