plugins {
    id 'com.android.application'
}

def sdlSource = System.getenv('XEM_SDL3_SRC')
if (sdlSource == null) {
    throw new GradleException('XEM_SDL3_SRC is unset: build inside nix develop path:./nix/runtime#android')
}
def repoRoot = file("$rootDir/../../..")
// Outputs stay under the repository's ignored build/ directory.
layout.buildDirectory = new File(repoRoot, 'build/android/gradle/app')
def sdlJava = new File(repoRoot, 'build/android/gradle/app/generated/sdl-java')
// src/runtime/scripts/android-build.sh puts libSDL3.so and libmain.so here per ABI.
def nativeLibs = new File(repoRoot, 'build/android/jniLibs')

// SDLActivity and its helpers, copied from the SDL release the desktop uses.
def copySdlJava = tasks.register('copySdlJava', Sync) {
    from("$sdlSource/android-project/app/src/main/java") {
        include 'org/libsdl/app/*.java'
    }
    into sdlJava
    // The Nix store copy is read-only.
    dirPermissions { unix('rwxr-xr-x') }
    filePermissions { unix('rw-r--r--') }
}

android {
    namespace = 'dev.xem.app'
    compileSdk = 34
    buildToolsVersion = '34.0.0'
    ndkVersion = '29.0.14206865'

    defaultConfig {
        applicationId = 'dev.xem.app'
        minSdk = 29
        targetSdk = 34
        versionCode = Integer.parseInt(System.getenv('XEM_ANDROID_VERSION_CODE') ?: '50000')
        versionName = (System.getenv('XEM_RELEASE_VERSION') ?: 'v0.5').replaceFirst('^v', '')
        ndk {
            abiFilters 'x86_64', 'arm64-v8a'
        }
    }

    signingConfigs {
        release {
            def key = System.getenv('XEM_ANDROID_KEYSTORE')
            if (key != null) {
                storeFile = file(key)
                storePassword = System.getenv('XEM_ANDROID_STORE_PASSWORD')
                keyAlias = 'xem'
                keyPassword = System.getenv('XEM_ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
            debuggable = false
        }
    }

    sourceSets {
        main {
            java.srcDirs += sdlJava
            jniLibs.srcDirs = [nativeLibs]
            assets.srcDirs += new File(repoRoot, 'build/android/notices')
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    lint {
        abortOnError = false
        checkReleaseBuilds = false
    }
}

base {
    archivesName = 'xem'
}

tasks.named('preBuild') {
    dependsOn copySdlJava
}

tasks.matching { it.name == 'preReleaseBuild' }.configureEach {
    doFirst {
        ['XEM_ANDROID_KEYSTORE', 'XEM_ANDROID_STORE_PASSWORD', 'XEM_ANDROID_KEY_PASSWORD'].each {
            if (!System.getenv(it)) throw new GradleException("$it is required for a signed release APK")
        }
    }
}
