[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
publish = false

# Pins approved for Phase 2 (docs/runtime.md). Slint's wgpu integration is
# unstable: slint 1.18.1's `unstable-wgpu-30` requires wgpu 30, so the two move
# together.
[workspace.dependencies]
slint = { version = "=1.18.1", default-features = false }
slint-build = { version = "=1.18.1" }
i-slint-backend-testing = { version = "=1.18.1", default-features = false }
i-slint-renderer-femtovg = { version = "=1.18.1", default-features = false }
wgpu = { version = "=30.0.1", default-features = false }
wgpu-hal = { version = "=30.0.1", default-features = false }
sdl3-sys = { version = "=0.6.8" }
openxr = { version = "=0.22.0", default-features = false }
# The Vulkan bindings of wgpu-hal 30, for the OpenXR Vulkan interop.
ash = { version = "=0.38.0", default-features = false }
# wasm-bindgen must equal the Nix wasm-bindgen-cli; js-sys, web-sys and
# wasm-bindgen-futures pin that wasm-bindgen exactly.
wasm-bindgen = { version = "=0.2.127" }
wasm-bindgen-futures = { version = "=0.4.77" }
js-sys = { version = "=0.3.104" }
web-sys = { version = "=0.3.104" }
raw-window-handle = { version = "0.6.2" }
jni-sys = { version = "=0.4.1" }
cc = { version = "1.2" }
bytemuck = { version = "1", features = ["derive"] }
glam = { version = "0.30" }
pollster = { version = "0.4" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
png = { version = "0.18.1" }
log = { version = "0.4" }

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
debug = 1

# The test suite's builds (src/runtime/scripts/suite.sh): release's
# optimization without link-time optimization or debug information, so a
# change rebuilds the test binaries in a quarter of release's time (37 s
# against 161 s after touching xem-gpu). A failing test target is built again
# with release's line tables (suite-debug) for its backtrace.
[profile.suite]
inherits = "release"
lto = false
debug = false

[profile.suite-debug]
inherits = "suite"
debug = 1
